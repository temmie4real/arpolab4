# Название всего автоматического процесса
name: Unity 2D Platformer CI/CD

# Условие запуска: реагировать на любой push в главную ветку main
on:
  push:
    branches: [ "main" ]

jobs:
  # ЗАДАЧА 1: Быстрая диагностика структуры проекта (Sanity Check)
  sanity_check:
    runs-on: ubuntu-latest # Запуск на бесплатном облачном сервере Linux
    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # Скачиваем код проекта на облачный сервер

      - name: Check Unity Directories
        run: |
          echo "=== Проверка наличия метаданных Unity ==="
          if [ -d "ProjectSettings" ]; then echo "ProjectSettings найден."; else echo "Ошибка!" && exit 1; fi
          if [ -d "Packages" ]; then echo "Packages найден."; else echo "Ошибка!" && exit 1; fi

      - name: Locate 2D Platformer Scripts and Tests
        run: |
          echo "=== Поиск C# скриптов и тестов в проекте ==="
          find Assets/ -name "BuildManager.cs" -print
          find Assets/Tests -name "*.asmdef" -print
          find Assets/Tests -name "PlayerTests.cs" -print
          find Assets/Tests -name "PlayerHealthTests.cs" -print
          find Assets/Tests -name "SimulationTests.cs" -print

      - name: Check Docker and Nginx Configuration
        run: |
          echo "=== Проверка конфигурации контейнеризации (ЛР №3) ==="
          if [ -f "nginx.conf" ]; then echo "nginx.conf найден."; else echo "Ошибка!" && exit 1; fi
          if [ -f "Dockerfile" ]; then echo "Dockerfile найден."; else echo "Ошибка!" && exit 1; fi

  # ЗАДАЧА 2 (ЛР №4): Автоматический запуск тестов Unity
  run_tests:
    needs: sanity_check # Тесты запускаются сразу после проверки структуры проекта
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true # Активируем поддержку Git LFS, если в игре есть тяжелая графика

      # Создаем кэш для папки Library, чтобы тесты запускались быстрее
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ hashFiles('Packages/packages-lock.json', 'Assets/**/*.asmdef') }}

      # Официальный CLI GameCI с фиксированной версией
      - name: Install GameCI CLI
        run: |
          curl -sL -o game-ci.tar.gz https://github.com/game-ci/cli/releases/download/v0.1.72/game-ci-linux-x64.tar.gz
          tar xzf game-ci.tar.gz ./game-ci
          echo "$PWD" >> $GITHUB_PATH

      # Запуск тестов EditMode и PlayMode в контейнере unityci/editor.
      # CLI вызывается напрямую, а не через game-ci/unity-test-runner@v4:
      # текущий экшен формирует флаг --no-coverageEnabled, которого CLI
      # v0.1.72 не понимает (Unknown argument, exit code 1). Рабочая форма -
      # --coverageEnabled=false. Coverage отключен, т.к. инструментирование
      # кода роняет Unity 6 в контейнере (SIGSEGV, exit code 139).
      - name: Run Unity Tests
        run: |
          game-ci test --docker --dockerShmSize=1025m \
            --engine=unity --testPlatforms='playmode;editmode;COMBINE_RESULTS' \
            --engineVersion=6000.3.10f1 --coverageEnabled=false \
            --artifactsPath=artifacts --dockerIsolationMode=default \
            --containerRegistryRepository=unityci/editor \
            --containerRegistryImageVersion=3
        env:
          # Секреты лицензии Unity для активации редактора на раннере
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

      # Сохраняем результаты и логи тестов артефактами (даже при падении)
      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: artifacts/

  # ЗАДАЧА 3: Автоматическая сборка Docker-образа в облако
  build_docker_image:
    needs: run_tests # Docker начнет собираться ТОЛЬКО если тесты прошли успешно!
    runs-on: ubuntu-latest
    # КРИТИЧЕСКИ ВАЖНЫЕ СТРОКИ: Разрешаем этой конкретной задаче публиковать пакеты
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Compressed Placeholders for Docker
        # Генерируем фейковые .gz файлы, чтобы шаг COPY в Dockerfile не упал без реального билда Unity
        run: |
          mkdir -p Builds/WebGL/Build
          if [ -z "$(ls -A Builds/WebGL/Build)" ]; then
            echo "<h3>Unity 6 Compressed Game Cloud Layer</h3>" > Builds/WebGL/index.html
            touch Builds/WebGL/Build/game.framework.js.gz
            touch Builds/WebGL/Build/game.wasm.gz
            touch Builds/WebGL/Build/game.data.gz
            echo "Создана временная структура сжатых файлов для сборщика Docker."
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # Системный автоматический токен GitHub

      - name: Build and Push Compressed Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/temmie4real/platformer-game:latest
            ghcr.io/temmie4real/platformer-game:${{ github.sha }}
